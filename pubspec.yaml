name: nothing_chat
description: NothingOS-style AI Chat UI
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^17.2.3
  wakelock_plus: ^1.2.8
  image_picker: ^1.1.0      # Gallery/camera image selection
  google_mlkit_text_recognition: ^0.15.0 # OCR for attached images
  file_picker: ^8.1.2       # File selection for documents
  extract_text: ^0.0.2      # Document text extraction (isolate + timeout)
  syncfusion_flutter_pdf: ^33.1.47 # Pure Dart PDF text extraction
  # LLM Backend Dependencies
  http: ^1.1.0              # Model download
  path_provider: ^2.1.0     # App files directory
  ffi: ^2.1.0               # Dart FFI bindings

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#000000"
  min_sdk_android: 21

flutter:
  uses-material-design: true
